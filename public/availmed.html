        function doShowPrev(profilePic, prevv) {

    style="background:linear-gradient(to right,#eef7f0,#f8fcf9);  background-image: url('pics1/ChatGPT\ Image\ Jul\ 20\,\ 2026\ at\ 10_34_19\ AM.png'); background-position: center; background-size: contain;" onload="setemail()">

    <form action="availmedform" enctype="multipart/form-data" method="post">
        <div class="container-fluid px-lg-5 px-3 mt-4 mb-4" style="margin-top: 110px !important;">
 
            <!-- Heading -->
            <div class="text-center text-white shadow fs-2 fw-bold py-3" style="background:#1976D2; border-radius:20px 20px 0 0;">
                Avail Medicine
            </div>
 
            <!-- Form Body -->
            <div style="background:white;
                    padding:40px;
                    border-radius:0 0 20px 20px;
                    box-shadow:0px 5px 20px rgba(0,0,0,0.12);">
 
                <div class="row">
 
                    <!-- Left Side Image -->
                    <div class="col-12 col-lg-4 text-center mb-4">
 
                        <img src="pics1/medicine.png" class="img-thumbnail shadow"
                            style="border-radius:15px; width:260px; height:260px; object-fit:cover;" id="medprev">
 
                        <br><br>
                        <input type="file" id="medimg" class="form-control"
                            name="medimgg" accept="image/*" onchange="doShowPrev(medimg,medprev)" required>
 
                    </div>
 
                    <!-- Right Side Form -->
                    <div class="col-12 col-lg-8">
 
                        <!-- Email -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Email ID:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="email" class="form-control" id="txtEmail" name="txtEmailn"
                                    value="abcde@gmail.com" required>
                            </div>
 
 
                        </div>
 
                        <!-- Medicine Name -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Medicine Name:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="txtMed" name="txtMedn" value="montair"
                                    required>
                            </div>
 
                        </div>
 
                        <!-- Expiry Date -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Expiry Date:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="date" class="form-control" id="txtExp" name="txtExpn"
                                    required>
                            </div>
 
                        </div>
 
                        <!-- Company -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Company:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="txtCompany" name="txtCompanyn" value="lc"
                                    required>
                            </div>
 
                        </div>
 
                        <!-- Packing -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Packing:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <select class="form-select" id="packing" name="packingn"
                                    required>
                                    <option>Select</option>
                                    <option>Strip</option>
                                    <option>Bottle</option>
                                    <option>Box</option>
                                    <option>Tube</option>
                                    <option>Tablet</option>
                                </select>
                            </div>
 
                        </div>
 
                        <!-- Quantity -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Quantity:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="number" class="form-control" id="txtQty" name="txtQtyn"
                                    required>
                            </div>
 
                        </div>
 
                        <!-- Other Info -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Other Info:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="txtInfo" name="txtInfon" value="nil">
                            </div>
 
                        </div>
 
                        <!-- Submit -->
                        <div class="row mt-4">
                            <div class="col-12 text-center">
 
                                <input type="submit" value="Avail" class="btn text-white shadow fw-bold" style="min-width:280px; background: #1976D2; border: none;">
 
                            </div>
                        </div>
 
                    </div>
 
                </div>
 
            </div>
 
        </div>
 
    </form>
