    <form action="availmedform" enctype="multipart/form-data" method="post">
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <div class="container-fluid px-lg-5 px-3 mt-4 mb-4" style="max-width:2500px; ">

            <!-- Heading -->
            <div class="text-center text-white shadow" style="background:linear-gradient(to right,#2ebe6a,#198754);
                   height:100px;
                   line-height:100px;
                   font-size:clamp(2rem,4vw,4rem);
                   font-weight:bold;
                   border-radius:20px 20px 0 0;
                     background: #1976D2;
    color: white;">
                Avail Medicine
            </div>

            <!-- Form Body -->
            <div style="background:white;
                    padding:50px;
                    border-radius:0 0 20px 20px;
                    box-shadow:0px 5px 20px rgba(0,0,0,0.12);">

                <div class="row">

                    <!-- Left Side Image -->
                    <div class="col-12 col-lg-4 text-center mb-4">

                        <img src="pics1/medicine.png" width="500" height="500" class="img-thumbnail shadow"
                            style="border-radius:15px;max-width:100%;height:auto;" id="medprev">

                        <br><br>
                        <br>
                        <input type="file" id="medimg" class="form-control" style="font-size:20px;height:60px;"
                            name="medimgg" accept="image/*" onchange="doShowPrev(medimg,medprev)" required>

                    </div>

                    <!-- Right Side Form -->
                    <div class="col-12 col-lg-8">

                        <!-- Email -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Email ID:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="email" class="form-control" id="txtEmail" name="txtEmailn"
                                    value="abcde@gmail.com" style="font-size:30px;height:65px;" required>
                            </div>


                        </div>

                        <!-- Medicine Name -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Medicine Name:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="txtMed" name="txtMedn" value="montair"
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>

                        <!-- Expiry Date -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Expiry Date:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="date" class="form-control" id="txtExp" name="txtExpn"
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>

                        <!-- Company -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Company:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="txtCompany" name="txtCompanyn" value="lc"
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>

                        <!-- Packing -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Packing:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <select class="form-select" id="packing" name="packingn"
                                    style="font-size:30px;height:65px;" required>
                                    <option>Select</option>
                                    <option>Strip</option>
                                    <option>Bottle</option>
                                    <option>Box</option>
                                    <option>Tube</option>
                                    <option>Tablet</option>
                                </select>
                            </div>

                        </div>

                        <!-- Quantity -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Quantity:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="number" class="form-control" id="txtQty" name="txtQtyn"
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>

                        <!-- Other Info -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Other Info:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="txtInfo" name="txtInfon" value="nil"
                                    style="font-size:30px;height:65px;">
                            </div>

                        </div>

                        <!-- Submit -->
                        <div class="row mt-5">
                            <div class="col-12 text-center">

                                <input type="submit" value="Avail" class="btn text-white shadow" style="width:450px;
                                       max-width:100%;
                                       height:70px;
                                       font-size:28px;
                                       font-weight:bold;
                                       background: #1976D2;
    color: white;
    border: none;">

                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </form>
