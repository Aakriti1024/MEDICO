    <script>
        function doShowPrev(profilePic, prevv) {
            const file = profilePic.files[0];
 
            if (file) {
                prevv.src = URL.createObjectURL(file);
            }
        }
    </script>
    <script>
        $(document).ready(function () {
 
            $("#sale").change(function () {
                if ($(this).is(":checked")) {
                    $("#amount").prop("disabled", false);
                    $("#amount").val("");
                }
            });
 
            $("#donation").change(function () {
                if ($(this).is(":checked")) {
                    $("#amount").val("0");
                    $("#amount").prop("disabled", true);
                }
            });
 
        });
    </script>
     <script>

function setemail(){

    <div class="container-fluid px-lg-5 px-3" style="margin-top: 110px;">
 
        <form action="availEquip" enctype="multipart/form-data" method="post">
 
            <div class="container-fluid mt-4 mb-4">
 
                <!-- Heading -->
                <div class="text-center text-white shadow fs-2 fw-bold py-3" style="background:#1976D2; border-radius:20px 20px 0 0;">
                    Medical Equipments
                </div>
 
                <!-- Form Body -->
                <div style="background:white;
                            padding:40px;
                            border-radius:0 0 20px 20px;
                            box-shadow:0px 5px 20px rgba(0,0,0,0.12);">
 
                    <!-- Email -->
                    <div class="row mb-4 align-items-center">
 
                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label fs-5 fw-semibold" style="color:#2c3e50;">
                                Email ID
                            </label>
                        </div>
 
                        <div class="col-12 col-md-9">
                            <input type="email" class="form-control" name="email" value="abcde@gmail.com" id="txtEmailequip"
                                required>
                        </div>
 
                    </div>
 
                    <!-- Equipment Type -->
                    <div class="row mb-4 align-items-center">
 
                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label fs-5 fw-semibold" style="color:#2c3e50;">
                                Medical Equipment Type
                            </label>
                        </div>
 
                        <div class="col-12 col-md-9">
                            <input type="text" class="form-control" name="equipment" value="wheelchair"
                                required>
                        </div>
 
                    </div>
 
                    <!-- Condition -->
                    <div class="row mb-4 align-items-center">
 
                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label fs-5 fw-semibold" style="color:#2c3e50;">
                                Condition
                            </label>
                        </div>
 
                        <div class="col-12 col-md-9">
                            <select class="form-select" name="condition" required>
                                <option selected disabled>Select Condition</option>
                                <option>Excellent</option>
                                <option>Very Good</option>
                                <option>Good</option>
                                <option>Moderate</option>
                                <option>Needs Repair</option>
                            </select>
                        </div>
 
                    </div>
 
                    <!-- Listing Type -->
                    <div class="row mb-4 align-items-center">
 
                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label fs-5 fw-semibold" style="color:#2c3e50;">
                                Listing Type
                            </label>
                        </div>
 
                        <div class="col-12 col-md-9">
 
                            <div class="form-check form-check-inline me-4">
                                <input class="form-check-input" type="radio" name="listingType" id="donation"
                                    value="donation" required>
 
                                <label class="form-check-label fs-5" for="donation">
                                    Donation
                                </label>
                            </div>
 
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="listingType" id="sale" value="sale">
 
                                <label class="form-check-label fs-5" for="sale">
                                    Sale
                                </label>
                            </div>
 
                        </div>
 
                    </div>
 
                    <!-- Amount -->
                    <div class="row mb-4 align-items-center">
 
                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label fs-5 fw-semibold" style="color:#2c3e50;">
                                Amount
                            </label>
                        </div>
 
                        <div class="col-12 col-md-9">
                            <input type="number" id="amount" name="amountname" class="form-control"
                                placeholder="Enter Amount" value="0" required>
                        </div>
 
                    </div>
 
                    <!-- Pictures -->
                    <div class="row mt-4">
 
                        <div class="col-12 col-md-6 text-center mb-4">
 
                            <label class="form-label fs-5 fw-bold" style="color: #1976D2">
                                Picture 1
                            </label>
 
                            <br>
 
                            <img src="pics1/profile.png" class="img-thumbnail shadow"
                                style="border-radius:15px; width:220px; height:220px; object-fit:cover;" id="objPrev">
 
                            <br><br>
 
                            <input type="file" required class="form-control" name="objpic"
                                id="objPic" accept="image/*" onchange="doShowPrev(objPic,objPrev)" required>
 
                        </div>
 
                        <div class="col-12 col-md-6 text-center mb-4">
 
                            <label class="form-label fs-5 fw-bold" style="color: #1976D2">
                                Picture 2
                            </label>
 
                            <br>
 
                            <img src="pics1/profile.png" class="img-thumbnail shadow"
                                style="border-radius:15px; width:220px; height:220px; object-fit:cover;" id="prevv">
 
                            <br><br>
 
                            <input type="file" required class="form-control"
                                name="profilePicc" id="profilePic" accept="image/*"
                                onchange="doShowPrev(profilePic,prevv)" required>
 
                        </div>
 
                    </div>
 
                    <!-- Other Information -->
                    <div class="row mb-4 align-items-center">
 
                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label fs-5 fw-semibold" style="color:#2c3e50;">
                                Other Information
                            </label>
                        </div>
 
                        <div class="col-12 col-md-9">
                            <textarea class="form-control" name="otherinfo" rows="5" required></textarea>
                        </div>
 
                    </div>
 
                    <!-- Submit -->
                    <div class="row mt-4">
                        <div class="col text-center">
 
                            <input type="submit" value="Avail for the Needy" class="btn text-white shadow fw-bold" style="min-width:280px; background: #1976D2; border: none;">
 
                        </div>
                    </div>
 
                </div>
 
            </div>
 
        </form>
 
    </div>
 
</body>
