    <script>
        function doShowPrev(profilePic, prevv) {
            const file = profilePic.files[0];

            if (file) {
                prevv.src = URL.createObjectURL(file);
            }
        }
    </script>
    <script>
        $(document).ready(function () {

            $("#sale").change(function () {
                if ($(this).is(":checked")) {
                    $("#amount").prop("disabled", false);
                    $("#amount").val("");
                }
            });

            $("#donation").change(function () {
                if ($(this).is(":checked")) {
                    $("#amount").val("0");
                    $("#amount").prop("disabled", true);
                }
            });

        });
    </script>

    <div class="container-fluid px-lg-5 px-3">

        <form action="availEquip" enctype="multipart/form-data" method="post">

            <div class="container-fluid mt-4 mb-4" style="max-width:2400px;">

                <!-- Heading -->
                <div class="text-center text-white shadow" style="background:linear-gradient(to right,#2ebe6a,#198754);
                           height:100px;
                           line-height:100px;
                           font-size:clamp(2rem,4vw,4rem);
                           font-weight:bold;
                           border-radius:20px 20px 0 0;
                             background: #1976D2;
    color: white;">
                    Medical Equipments
                </div>

                <!-- Form Body -->
                <div style="background:white;
                            padding:50px;
                            border-radius:0 0 20px 20px;
                            box-shadow:0px 5px 20px rgba(0,0,0,0.12);">

                    <!-- Email -->
                    <div class="row mb-4 align-items-center">

                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label" style="font-size:40px;font-weight:600;color:#2c3e50;">
                                Email ID
                            </label>
                        </div>

                        <div class="col-12 col-md-9">
                            <input type="email" class="form-control" name="email" value="abcde@gmail.com" id="txtEmailequip"
                                style="font-size:30px;height:65px;" required>
                        </div>

                    </div>

                    <!-- Equipment Type -->
                    <div class="row mb-4 align-items-center">

                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label" style="font-size:40px;font-weight:600;color:#2c3e50;">
                                Medical Equipment Type
                            </label>
                        </div>

                        <div class="col-12 col-md-9">
                            <input type="text" class="form-control" name="equipment" value="wheelchair"
                                style="font-size:30px;height:65px;" required>
                        </div>

                    </div>

                    <!-- Condition -->
                    <div class="row mb-4 align-items-center">

                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label" style="font-size:40px;font-weight:600;color:#2c3e50;">
                                Condition
                            </label>
                        </div>

                        <div class="col-12 col-md-9">
                            <select class="form-select" name="condition" style="font-size:30px;height:65px;" required>
                                <option selected disabled>Select Condition</option>
                                <option>Excellent</option>
                                <option>Very Good</option>
                                <option>Good</option>
                                <option>Moderate</option>
                                <option>Needs Repair</option>
                            </select>
                        </div>

                    </div>

                    <!-- Listing Type -->
                    <div class="row mb-4 align-items-center">

                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label" style="font-size:40px;font-weight:600;color:#2c3e50;">
                                Listing Type
                            </label>
                        </div>

                        <div class="col-12 col-md-9">

                            <div class="form-check form-check-inline me-5">
                                <input class="form-check-input" type="radio" name="listingType" id="donation"
                                    value="donation" required>

                                <label class="form-check-label" for="donation" style="font-size:40px;">
                                    Donation
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="listingType" id="sale" value="sale">

                                <label class="form-check-label" for="sale" style="font-size:40px;">
                                    Sale
                                </label>
                            </div>

                        </div>

                    </div>

                    <!-- Amount -->
                    <div class="row mb-4 align-items-center">

                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label" style="font-size:40px;font-weight:600;color:#2c3e50;">
                                Amount
                            </label>
                        </div>

                        <div class="col-12 col-md-9">
                            <input type="number" id="amount" name="amountname" class="form-control"
                                placeholder="Enter Amount" value="0" style="font-size:30px;height:65px;" required>
                        </div>

                    </div>

                    <!-- Pictures -->
                    <div class="row mt-5">

                        <div class="col-12 col-md-6 text-center mb-4">

                            <label class="form-label" style="font-size:40px;font-weight:bold;color: #1976D2">
                                Picture 1
                            </label>

                            <br>

                            <img src="pics1/profile.png" width="360" height="360" class="img-thumbnail shadow"
                                style="border-radius:15px;max-width:100%;height:auto;" id="objPrev">

                            <br><br>

                            <input type="file" required class="form-control" style="font-size:20px;height:60px;" name="objpic"
                                id="objPic" accept="image/*" onchange="doShowPrev(objPic,objPrev)" required>

                        </div>

                        <div class="col-12 col-md-6 text-center mb-4">

                            <label class="form-label" style="font-size:40px;font-weight:bold;color: #1976D2">
                                Picture 2
                            </label>

                            <br>

                            <img src="pics1/profile.png" width="360" height="360" class="img-thumbnail shadow"
                                style="border-radius:15px;max-width:100%;height:auto;" id="prevv">

                            <br><br>

                            <input type="file" required class="form-control" style="font-size:20px;height:60px;"
                                name="profilePicc" id="profilePic" accept="image/*"
                                onchange="doShowPrev(profilePic,prevv)" required>

                        </div>

                    </div>

                    <!-- Other Information -->
                    <div class="row mb-4 align-items-center">

                        <div class="col-12 col-md-3 mb-2">
                            <label class="form-label" style="font-size:40px;font-weight:600;color:#2c3e50;">
                                Other Information
                            </label>
                        </div>

                        <div class="col-12 col-md-9">
                            <textarea class="form-control" name="otherinfo" rows="5" style="font-size:22px;" required></textarea>
                        </div>

                    </div>

                    <!-- Submit -->
                    <div class="row mt-5">
                        <div class="col text-center">

                            <input type="submit" value="Avail for the Needy" class="btn text-white shadow" style="width:500px;
                                       max-width:100%;
                                       height:70px;
                                       font-size:35px;
                                       font-weight:bold;
                                      background: #1976D2;
    color: white;
    border: none;">

                        </div>
                    </div>

                </div>

            </div>

        </form>

    </div>
