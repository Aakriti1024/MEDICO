function setemailngo(){

    <form action="ngoprof" enctype="multipart/form-data" method="post">
        <br><br><br><br><br><br><br><br>
        <div class="container-fluid px-lg-5 px-3 mt-4 mb-4" style="max-width:2500px; ">

            <!-- Heading -->
            <div class="text-center text-white shadow" style="background:linear-gradient(to right,#2ebe6a,#198754);
                   height:100px;
                   line-height:100px;
                   font-size:clamp(2rem,4vw,4rem);
                   font-weight:bold;
                   border-radius:20px 20px 0 0;
                     background: #1976D2;
    color: white;">
                NGO REGISTRATION
            </div>

            <!-- Form Body -->
            <div style="background:white;
                    padding:50px;
                    border-radius:0 0 20px 20px;
                    box-shadow:0px 5px 20px rgba(0,0,0,0.12);">

                <div class="row">

                    <!-- Left Side Image -->
                    <div class="col-12 col-lg-4 text-center mb-4">
                        <br><br>
                        <img src="pics1/medicine.png" width="500" height="700" class="img-thumbnail shadow"
                            style="border-radius:15px;max-width:100%;height:auto;" id="medprev">

                        <br><br>
                        <br>
                        <input type="file" id="medimg" class="form-control" style="font-size:20px;height:60px;"
                            name="ngoimg" accept="image/*" onchange="doShowPrev(medimg,medprev)" required>

                    </div>

                    <!-- Right Side Form -->
                    <div class="col-12 col-lg-8">

                        <!-- Email -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Email ID:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="email" class="form-control" id="ngoEmail" name="ngoEmailn"
                                   style="font-size:30px;height:65px;" required>
                            </div>


                        </div>


                        <!-- ngo Name -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Ngo Name:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoname" name="ngonamen"
                                    placeholder="enter name of ngo" style="font-size:30px;height:65px;" required>
                            </div>

                        </div>
                        <!--contact no -->

                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Contact no.:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngocontact" name="ngocontactn"
                                     style="font-size:30px;height:65px;" required>
                            </div>

                        </div>
                        <!-- registration office -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Registration office:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngooff" name="ngooffn" 
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>
                        <!-- city-->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    City:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngocity" name="ngocityn" 
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>
                        <!-- website -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Website:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoweb" name="ngowebn" placeholder="enter null if no website"
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>

                        <!-- since -->

                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Since:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="date" class="form-control" id="ngodate" name="ngodaten"
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>
                        <!-- chair person -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Chair Person:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngochair" name="ngochairn" 
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>


                        <!-- Other Info -->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    About Ngo:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoinfo" name="ngoinfon" placeholder="enter null for no otherinfo"
                                    style="font-size:30px;height:65px;">
                            </div>

                        </div>
                        <!--registration number-->
                        <div class="row mb-4 align-items-center">

                            <div class="col-12 col-md-3 mb-2">
                                <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                                    Registration Number:
                                </label>
                            </div>

                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoreg" name="ngoregn"
                                    style="font-size:30px;height:65px;" required>
                            </div>

                        </div>
                        <!-- Submit -->
                        <div class="row mt-5">
                            <div class="col-12 text-center">

                                <input type="submit" value="Register" class="btn text-white shadow" style="width:450px;
                                       max-width:100%;
                                       height:70px;
                                       font-size:28px;
                                       font-weight:bold;
                                       background: #1976D2;
    color: white;
    border: none;">

                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </form>
</body>
