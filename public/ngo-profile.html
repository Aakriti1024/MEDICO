    </script>
        <script>

function setemailngo(){

    style=" background-image: url('pics1/ChatGPT\ Image\ Jul\ 20\,\ 2026\ at\ 10_34_19\ AM.png'); background-position: center; background-size: contain;" onload="setemailngo();">

    <form action="ngoprof" enctype="multipart/form-data" method="post">
        <div class="container-fluid px-lg-5 px-3 mt-4 mb-4" style="margin-top: 110px !important;">
 
            <!-- Heading -->
            <div class="text-center text-white shadow fs-2 fw-bold py-3" style="background:#1976D2; border-radius:20px 20px 0 0;">
                NGO REGISTRATION
            </div>
 
            <!-- Form Body -->
            <div style="background:white;
                    padding:40px;
                    border-radius:0 0 20px 20px;
                    box-shadow:0px 5px 20px rgba(0,0,0,0.12);">
 
                <div class="row">
 
                    <!-- Left Side Image -->
                    <div class="col-12 col-lg-4 text-center mb-4">
                        <img src="pics1/medicine.png" class="img-thumbnail shadow"
                            style="border-radius:15px; width:220px; height:300px; object-fit:cover;" id="medprev">
 
                        <br><br>
                        <input type="file" id="medimg" class="form-control"
                            name="ngoimg" accept="image/*" onchange="doShowPrev(medimg,medprev)" required>
 
                    </div>
 
                    <!-- Right Side Form -->
                    <div class="col-12 col-lg-8">
 
                        <!-- Email -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Email ID:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="email" class="form-control" id="ngoEmail" name="ngoEmailn"
                                   required>
                            </div>
 
 
                        </div>
 
 
                        <!-- ngo Name -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Ngo Name:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoname" name="ngonamen"
                                    placeholder="enter name of ngo" required>
                            </div>
 
                        </div>
                        <!--contact no -->
 
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Contact no.:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngocontact" name="ngocontactn"
                                     required>
                            </div>
 
                        </div>
                        <!-- registration office -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Registration office:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngooff" name="ngooffn" 
                                    required>
                            </div>
 
                        </div>
                        <!-- city-->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    City:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngocity" name="ngocityn" 
                                    required>
                            </div>
 
                        </div>
                        <!-- website -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Website:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoweb" name="ngowebn" placeholder="enter null if no website"
                                    required>
                            </div>
 
                        </div>
 
                        <!-- since -->
 
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Since:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="date" class="form-control" id="ngodate" name="ngodaten"
                                    required>
                            </div>
 
                        </div>
                        <!-- chair person -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Chair Person:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngochair" name="ngochairn" 
                                    required>
                            </div>
 
                        </div>
 
 
                        <!-- Other Info -->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    About Ngo:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoinfo" name="ngoinfon" placeholder="enter null for no otherinfo">
                            </div>
 
                        </div>
                        <!--registration number-->
                        <div class="row mb-4 align-items-center">
 
                            <div class="col-12 col-md-3 mb-2">
                                <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                                    Registration Number:
                                </label>
                            </div>
 
                            <div class="col-12 col-md-9">
                                <input type="text" class="form-control" id="ngoreg" name="ngoregn"
                                    required>
                            </div>
 
                        </div>
                        <!-- Submit -->
                        <div class="row mt-4">
                            <div class="col-12 text-center">
 
                                <input type="submit" value="Register" class="btn text-white shadow fw-bold" style="min-width:280px; background: #1976D2; border: none;">
 
                            </div>
                        </div>
 
                    </div>
 
                </div>
 
            </div>
 
        </div>
 
    </form>
</body>
 
</html>
