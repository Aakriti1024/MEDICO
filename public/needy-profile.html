    <form action="/ai-read-pic" enctype="multipart/form-data" method="post">
   
        <div class="container-fluid px-lg-5 px-3 mt-4 mb-4" style="max-width:2500px; ">

            <!-- Heading -->
            <div class="text-center text-white shadow" style="background:linear-gradient(to right,#2ebe6a,#198754);
                   height:100px;
                   line-height:100px;
                   font-size:clamp(2rem,4vw,4rem);
                   font-weight:bold;
                   border-radius:20px 20px 0 0;
                     background: #1976D2;
    color: white;">
               Needy Profile
            </div>

            <!-- Form Body -->
            <div style="background:white;
                    padding:50px;
                    border-radius:0 0 20px 20px;
                    box-shadow:0px 5px 20px rgba(0,0,0,0.12);">

                <!-- Email -->
               <div class="row mb-4 align-items-center">

                    <div class="col-12 col-md-2 mb-2">
                        <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                            Email:
                        </label>
                    </div>

                    <div class="col-12 col-md-4 mb-2">
                        <input type="email" class="form-control" style="font-size:30px;height:65px;" id="txtemail"
                            name="txtemailn"  required>
                    </div>

                    <div class="col-12 col-md-2 mb-2">
                        <label style="font-size:40px;font-weight:600;color:#2c3e50;">
                            Mobile Number:
                        </label>
                    </div>

                    <div class="col-12 col-md-4">
                        <input type="text" class="form-control" style="font-size:30px;height:65px;" id="txtmobile"
                            name="txtmobilen"  required>
                    </div>

                </div>

             

             

                <!-- Images -->
                <div class="row mt-5">

                    <!-- Aadhaar -->
                    <div class="col-12 col-md-6 text-center mb-4">

                        <label class="form-label" style="font-size:40px;font-weight:bold;color: #1976D2">
                            Upload Front AdharPic
                        </label>

                        <br>

                        <img src="pics1/profile.png" width="360" height="360" class="img-thumbnail shadow"
                            style="border-radius:15px;max-width:100%;height:auto;" id="aadhaarPrev" >

                        <br><br>

                        <input type="file" class="form-control" style="font-size:30px;height:60px;" name="afrontpic"
                            id="afrontPic" accept="image/*" onchange="doShowPrev(afrontPic,aadhaarPrev)" required >
                            <!--The accept attribute tells the browser which types of files the user is allowed to select.-->
                    </div>

                    <!-- Profile Picture -->
                    <div class="col-12 col-md-6 text-center mb-4">

                        <label class="form-label" style="font-size:40px;font-weight:bold;color: #1976D2">
                             Upload Back AdharPic
                        </label>

                        <br>

                        <img src="pics1/profile.png" width="360" height="360" class="img-thumbnail shadow"
                            style="border-radius:15px;max-width:100%;height:auto;" id="prevv" >

                        <br><br>

                        <input type="file" class="form-control" style="font-size:30px;height:60px;" name="abackpic"
                            id="abackPic" accept="image/*" onchange="doShowPrev(abackPic,prevv)"  required><!--we give id of both-->
                    </div>

                </div>

                <!-- Submit -->

    color: white;
    border: none;
    
                               " id="btnsub">

                    
                    </div>
                </div>
