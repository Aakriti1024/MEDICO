 <script>
 
        function doShowPrev(profilePic, prevv) {
            const file = profilePic.files[0];
 
            if (file) {
                prevv.src = URL.createObjectURL(file);
            }
        }
 
    </script>
     <script>
        //for email
function setemail(){
    document.getElementById("txtemail").value=localStorage.getItem("activeuser");
    document.getElementById("txtemail").readOnly=true;
}
    </script>
<script>
 function logout(){
    localStorage.removeItem("activeuser");
    location.href="startingpage.html";
 }
</script>
 
    </head>
   
<body style="background:linear-gradient(to right,#eef7f0,#f8fcf9); background-image: url('pics1/ChatGPT\ Image\ Jul\ 20\,\ 2026\ at\ 10_34_19\ AM.png'); background-position: center; background-size: contain;" onload="setemail();" >

    <form action="/ai-read-pic" enctype="multipart/form-data" method="post">
   
        <div class="container-fluid px-lg-5 px-3 mt-4 mb-4" style="margin-top: 130px !important;">
 
            <!-- Heading -->
            <div class="text-center text-white shadow fs-2 fw-bold py-3" style="background:#1976D2; border-radius:20px 20px 0 0;">
               Needy Profile
            </div>
 
            <!-- Form Body -->
            <div style="background:white;
                    padding:40px;
                    border-radius:0 0 20px 20px;
                    box-shadow:0px 5px 20px rgba(0,0,0,0.12);">
 
                <!-- Email -->
               <div class="row mb-4 align-items-center">
 
                    <div class="col-12 col-md-2 mb-2">
                        <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                            Email:
                        </label>
                    </div>
 
                    <div class="col-12 col-md-4 mb-2">
                        <input type="email" class="form-control" id="txtemail"
                            name="txtemailn"  required>
                    </div>
 
                    <div class="col-12 col-md-2 mb-2">
                        <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                            Mobile Number:
                        </label>
                    </div>
 
                    <div class="col-12 col-md-4">
                        <input type="text" class="form-control" id="txtmobile"
                            name="txtmobilen"  required>
                    </div>
 
                </div>
 
             
 
             
 
                <!-- Images -->
                <div class="row mt-4">
 
                    <!-- Aadhaar -->
                    <div class="col-12 col-md-6 text-center mb-4">
 
                        <label class="form-label fs-5 fw-bold" style="color: #1976D2">
                            Upload Front AdharPic
                        </label>
 
                        <br>
 
                        <img src="pics1/profile.png" class="img-thumbnail shadow"
                            style="border-radius:15px; width:220px; height:220px; object-fit:cover;" id="aadhaarPrev" >
 
                        <br><br>
 
                        <input type="file" class="form-control" name="afrontpic"
                            id="afrontPic" accept="image/*" onchange="doShowPrev(afrontPic,aadhaarPrev)" required >
                            <!--The accept attribute tells the browser which types of files the user is allowed to select.-->
                    </div>
 
                    <!-- Profile Picture -->
                    <div class="col-12 col-md-6 text-center mb-4">
 
                        <label class="form-label fs-5 fw-bold" style="color: #1976D2">
                             Upload Back AdharPic
                        </label>
 
                        <br>
 
                        <img src="pics1/profile.png" class="img-thumbnail shadow"
                            style="border-radius:15px; width:220px; height:220px; object-fit:cover;" id="prevv" >
 
                        <br><br>
 
                        <input type="file" class="form-control" name="abackpic"
                            id="abackPic" accept="image/*" onchange="doShowPrev(abackPic,prevv)"  required><!--we give id of both-->
                    </div>
 
                </div>
 
                <!-- Submit -->
                <div class="row mt-4">
                    <div class="col-12 text-center">
                       
 
                        <input type="submit" value="Upload Details" class="btn text-white shadow fw-bold" style="min-width:260px; background: #1976D2; border: none;" id="btnsub">
 
                    
                    </div>
                </div>
 
            </div>
 
        </div>
 
    </form>
 
</body>
