    <!----------AJAX signup btn click -------------->

    <script>
        $(document).ready(function () {

            $("#btnSignup").click(function () {
                if ($("#txtEmail").val().trim() == "") {
                    alert("Email is required");
                    $("#txtEmail").focus();
                    return;
                }

                if ($("#txtPwd").val().trim() == "") {
                    alert("Password is required");
                    $("#txtPwd").focus();
                    return;
                }

                if ($("#utype").val() == "none") {
                    alert("Select User Type");
                    $("#utype").focus();
                    return;
                }
                let obj = {
                    url: "/signup-route",

                    data: {
                        emailkuch: $("#txtEmail").val(),
                        pwdkuch: $("#txtPwd").val(),
                        userkuch: $("#utype").val()
                    }
                }
                $.ajax(obj).then(function (respStrr) {
                    $("#msgSpan").html(respStrr);
                }).fail(function (jqXHR) {
                    console.log(jqXHR.responseText);
                    alert(jqXHR.responseText);
                })
            })
        })
    </script>
    <!--------------LOGIN-----AJAX btnclick----------------->
    <script>
        $(document).ready(function () {

                        pwdLogin: $("#txtPwd2").val(),
                        
                    }

                $.ajax(obj).then(function (respStrr) {

                }).fail(function (jqXHR) {
                    console.log(jqXHR.responseText);
                    alert(jqXHR.responseText);
                })
            })
        })
    </script>

    <!-------------------signup blur ajax----------------->
    <script>
        $(document).ready(function () {
            $("#txtEmail").blur(function () {
                let email = $("#txtEmail").val();
                if (email == "") return;
                let obj = {
                    url: "/email-check",
                    data: {
                        emailcheck: $("#txtEmail").val()
                    }
                }
                $.ajax(obj).then(function (respStrr) {
                    alert(respStrr);

                    $("#txtEmail").val("");   // clear textbox
                    $("#txtEmail").focus();   // put cursor back
                }).fail(function (jqXHR) {
                    console.log(jqXHR.responseText);
                    alert(jqXHR.responseText);
                })
            })
        })
    </script>
    <!--for password eeye signup-->
    <script>
        $(document).ready(function () {

            $("#eyee").click(function () {

                if ($("#txtPwd").attr("type") == "password") {
                    $("#txtPwd").attr("type", "text");
                    $(this).removeClass("fa-eye-slash").addClass("fa-eye");
                }
                else {
                    $("#txtPwd").attr("type", "password");
                    $(this).removeClass("fa-eye").addClass("fa-eye-slash");
                }

            });

        });
    </script>
    <!-------------login eye-->
    <script>

    <!------------regex---------->
    <script>
        $(document).ready(function () {
            $("#txtEmail").blur(function () {
                let e = $(this).val();
                if (e == "") return;
                let emailReg = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
                if (!emailReg.test(e)) {
                    alert("INVALID EMAIL");
                    $(this).val("").focus();

                }
            })
            $("#txtPwd").blur(function () {
                let pwd = $(this).val();
                if (pwd == "") return;
                let pwdReg = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

                if (!pwdReg.test(pwd)) {
                    alert("INVALID PASS")
                    $(this).val("").focus();

                }
            });
        })
    </script>
