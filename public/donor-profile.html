    <script>
 
        function doShowPrev(profilePic, prevv) {
            const file = profilePic.files[0];
 
            if (file) {
                prevv.src = URL.createObjectURL(file);
            }
        }
 
    </script>
 
    <script>
        //for email
function setemail(){
    document.getElementById("txtEmail").value=localStorage.getItem("activeuser");
    document.getElementById("txtEmail").readOnly=true;
}
    </script>
 
    <!---------------============AJJAXXX========-->
    <script>
        $(document).ready(function () {
            $("#donordataget").click(function () {
                let obj = {
                    url: "/show-data-profile",
                    data: {
                        emailkuj: $("#txtEmail").val()
                    }
                }
                $.ajax(obj).then(function (jsonarr) {
                    //    alert(JSON.stringify(jsonarr));
                    let namee = jsonarr[0].name;
                    $("#txtName").val(namee);
                    let mob = jsonarr[0].mobile;
                    $("#txtMobile").val(mob);
                    let add = jsonarr[0].address;
                    $("#txtAddress").val(add);
                    let city = jsonarr[0].city;
                    $("#txtCity").val(city);
                    $("#aadhaarPrev").prop("src", jsonarr[0].acardpath);
                    $("#prevv").prop("src", jsonarr[0].picpath);
                    $("#hdn").val(jsonarr[0].acardpath);   
                    $("#hdn1").val(jsonarr[0].picpath);   
                })
            })
        })
    </script>

    <form action="donorprof" enctype="multipart/form-data" method="post">
    <input type="hidden" id="hdn" name="hdn">
    <input type="hidden" id="hdn1" name="hdn1">
 
        <div class="container-fluid px-lg-5 px-3" style="margin-top: 110px; margin-bottom: 2rem;">
 
            <!-- Heading -->
            <div class="text-center text-white shadow fs-2 fw-bold py-3" style="background:#1976D2; border-radius:20px 20px 0 0;">
                Donor Profile
            </div>
 
            <!-- Form Body -->
            <div style="background:white;
                    padding:40px;
                    border-radius:0 0 20px 20px;
                    box-shadow:0px 5px 20px rgba(0,0,0,0.12);">
 
                <!-- Email -->
                <div class="row mb-4 align-items-center">
 
                    <div class="col-12 col-md-2 mb-2">
                        <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                            Email ID:
                        </label>
                    </div>
 
                    <div class="col-12 col-md-6 mb-2">
                        <input type="email" class="form-control" id="txtEmail"
                            name="txtEmailN" value="aakriti@gmail.com" required>
                    </div>
 
                    <div class="col-12 col-md-4 text-center">
                        <input type="button" class="btn text-white w-100" id="donordataget" value="Get Profile Data" style="background:#1976D2; border:none;">
                    </div>
 
                </div>
 
                <!-- Name & Mobile -->
                <div class="row mb-4 align-items-center">
 
                    <div class="col-12 col-md-2 mb-2">
                        <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                            Name:
                        </label>
                    </div>
 
                    <div class="col-12 col-md-4 mb-2">
                        <input type="text" class="form-control" id="txtName"
                            name="txtNameN"  required>
                    </div>
 
                    <div class="col-12 col-md-2 mb-2">
                        <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                            Mobile Number:
                        </label>
                    </div>
 
                    <div class="col-12 col-md-4">
                        <input type="text" class="form-control" id="txtMobile"
                            name="txtMobileN"  required>
                    </div>
 
                </div>
 
                <!-- Address & City -->
                <div class="row mb-4 align-items-center">
 
                    <div class="col-12 col-md-2 mb-2">
                        <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                            Address:
                        </label>
                    </div>
 
                    <div class="col-12 col-md-6 mb-2">
                        <input type="text" class="form-control" id="txtAddress"
                            name="txtAddressN"  required>
                    </div>
 
                    <div class="col-12 col-md-1 mb-2">
                        <label class="fs-5 fw-semibold" style="color:#2c3e50;">
                            City:
                        </label>
                    </div>
 
                    <div class="col-12 col-md-3">
                        <input type="text" class="form-control" id="txtCity"
                            name="txtCityN" 
                             required>
                    </div>
 
                </div>
 
                <!-- Images -->
                <div class="row mt-4">
 
                    <!-- Aadhaar -->
                    <div class="col-12 col-md-6 text-center mb-4">
 
                        <label class="form-label fs-5 fw-bold" style="color: #1976D2">
                            Upload Aadhaar Card
                        </label>
 
                        <br>
 
                        <img src="pics1/profile.png" class="img-thumbnail shadow"
                            style="border-radius:15px; width:220px; height:220px; object-fit:cover;" id="aadhaarPrev">
 
                        <br><br>
 
                        <input type="file" class="form-control" name="adharpic"
                            id="aadhaarPic" accept="image/*" onchange="doShowPrev(aadhaarPic,aadhaarPrev)" >
                    </div>
 
                    <!-- Profile Picture -->
                    <div class="col-12 col-md-6 text-center mb-4">
 
                        <label class="form-label fs-5 fw-bold" style="color: #1976D2">
                            Profile Picture 
                        </label>
 
                        <br>
 
                        <img src="pics1/profile.png" class="img-thumbnail shadow"
                            style="border-radius:15px; width:220px; height:220px; object-fit:cover;" id="prevv">
 
                        <br><br>
 
                        <input type="file" class="form-control" name="profilePicc"
                            id="profilePic" accept="image/*" onchange="doShowPrev(profilePic,prevv)">
                    </div>
 
                </div>
 
                <!-- Submit -->
                <div class="row mt-4">
                    <div class="col-12 text-center d-flex flex-wrap justify-content-center gap-3">
 
                        <input type="submit" value="Send to Server" class="btn text-white shadow fw-bold" style="min-width:260px; background: #1976D2; border: none;">
 
                        <input type="submit" value="Update My Profile" class="btn text-white shadow fw-bold" style="min-width:260px; background: #1976D2; border: none;"
                               formaction="/updateprof">
                    </div>
                </div>
 
            </div>
 
        </div>
